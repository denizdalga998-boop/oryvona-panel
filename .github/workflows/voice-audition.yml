name: Argon fixed male voice audition
on:
  push:
    branches: [ceo/voice-audition-v1]
    paths: ['.github/voice-audition/**', '.github/workflows/voice-audition.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: argon-fixed-voice-audition
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test download and fixed-prompt guards without inference
        run: python -m unittest discover -s .github/voice-audition -p 'test_*.py'
      - name: Install pinned CPU runtime
        run: python -m pip install --disable-pip-version-check onnxruntime==1.23.1 numpy==2.2.6 soundfile==0.13.1
      - name: Render one fixed original male Turkish audition on cloud CPU
        run: python .github/voice-audition/render.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: argon-male-voice-audition-v1
          path: voice-output/
          if-no-files-found: error
          retention-days: 3
