<body>
<title>Oryvona Games Paneli</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: Oryvona Games house look — the logo's deep navy for the header band and the "right now" card, warm paper for the rest, the gamepad's cyan/gold/purple only as accents (OpenAI / Claude / Deniz). Single light theme by choice. */
:root{
  color-scheme:light;
  --bg:#f4f2ee; --surface:#ffffff; --surface-2:#eeedf3; --line:#dddbe6;
  --fg:#1b1a2e; --fg-2:#524f66; --fg-3:#827f94;
  --navy:#12112e; --navy-2:#1d1b45;
  --brand:#2a2860; --brand-deep:#1b1a3e; --brand-soft:#e9e6f7; --brand-ink:#12112e;
  --cyan:#22c3ee; --gold:#f0b429; --violet:#9b4ddb;
  --sun:#f0b429; --sun-soft:#fbefd3;
  --good:#2b8a4e; --good-soft:#def3e4; --warn:#b26a0c; --warn-soft:#fbead0; --bad:#c23b3b; --bad-soft:#f9e0e0; --info:#2f7be0; --info-soft:#e3ecfb;
  --claude:#b8811a; --claude-soft:#fbefd3; --work:#2f7be0; --work-soft:#e3ecfb; --deniz:#8b3fd9; --deniz-soft:#efe4fb;
  --sans:"Nunito",ui-rounded,"Segoe UI",system-ui,Roboto,Arial,sans-serif;
  --r:18px; --r-s:12px;
  --shadow:0 1px 2px rgba(27,26,46,.05),0 8px 24px rgba(27,26,46,.08);
}
.band{background:var(--navy);margin:-14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 14px;border-radius:0 0 26px 26px;display:flex;flex-direction:column;align-items:center;gap:6px}
.band img{display:block;width:min(240px,70%);height:auto;max-width:100%}
.band .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.band .sub{color:#cfcbe6;font-size:.86rem;font-weight:700}
.chip.onnavy{background:rgba(255,255,255,.1);color:#e9e6f7}
.chip.onnavy.good{background:rgba(66,196,120,.18);color:#8fe3ad} .chip.onnavy.warn{background:rgba(240,180,41,.18);color:#f6cf6d} .chip.onnavy.bad{background:rgba(236,96,96,.2);color:#ff9c9c}
.hero{position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--violet))}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.45;margin:0}
.wrap{max-width:720px;margin:0 auto;padding-block:14px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0} h1,h2,h3{text-wrap:balance}
h1{font-size:1.3rem;font-weight:900;letter-spacing:-.01em;line-height:1.15}
h2{font-size:1.2rem;font-weight:900}
.muted{color:var(--fg-2)} .small{font-size:.9rem} .num{font-variant-numeric:tabular-nums}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.studio{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;flex:none}
.studio small{display:block;color:var(--fg-2);font-size:.86rem;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:.86rem;font-weight:800;white-space:nowrap;background:var(--surface-2);color:var(--fg-2)}
.chip.dot::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)} .chip.brand{background:var(--brand-soft);color:var(--brand-deep)}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);color:var(--fg-2);border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer;display:inline-flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.tab .code{font-size:.78rem;font-weight:800;color:var(--fg-3);background:var(--surface-2);padding:2px 8px;border-radius:999px}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff} .tab[aria-selected="true"] .code{background:rgba(255,255,255,.18);color:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
/* home cards */
.cards{display:flex;flex-direction:column;gap:12px}
.cardbtn{width:100%;text-align:left;border:0;background:var(--surface);border-radius:var(--r);padding:16px 16px 16px 14px;box-shadow:var(--shadow);display:grid;grid-template-columns:48px minmax(0,1fr) 20px;gap:14px;align-items:center;cursor:pointer;font:inherit;color:inherit}
.cardbtn:active{transform:scale(.995)}
.cardbtn .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand)}
.cardbtn .ic svg{width:24px;height:24px}
.cardbtn .ic.claude{background:var(--claude-soft);color:var(--claude)} .cardbtn .ic.work{background:var(--work-soft);color:var(--work)} .cardbtn .ic.deniz{background:var(--deniz-soft);color:var(--deniz)}
.cardbtn .ic.good{background:var(--good-soft);color:var(--good)} .cardbtn .ic.warn{background:var(--warn-soft);color:var(--warn)} .cardbtn .ic.bad{background:var(--bad-soft);color:var(--bad)}
.cardbtn .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.cardbtn .k{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.cardbtn .v{font-size:1.15rem;font-weight:900;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardbtn .s{font-size:.9rem;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardbtn .chev{color:var(--fg-3)} .cardbtn .chev svg{width:20px;height:20px}
.hero{background:var(--navy-2);color:#fff;border-radius:var(--r);padding:22px 20px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.hero .k{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero .v{font-size:1.6rem;font-weight:900;line-height:1.15}
.hero .s{opacity:.92;font-size:1rem}
.foot{color:var(--fg-3);font-size:.82rem;text-align:center}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(29,43,42,.38);display:none;z-index:9}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -8px 40px rgba(29,43,42,.18);max-height:min(88vh,88dvh);display:none;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet.open{display:flex}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:var(--line);margin:10px auto 6px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 12px}
.sheet .close{border:0;background:var(--surface-2);color:var(--fg);width:40px;height:40px;border-radius:50%;font:inherit;font-weight:900;font-size:1.1rem;cursor:pointer}
.sheet .body{overflow:auto;padding:0 4px 8px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:760px){.sheet{left:50%;right:auto;transform:translateX(-50%);width:680px;border-radius:24px;bottom:24px;max-height:84vh;padding-left:20px;padding-right:20px;padding-bottom:20px}}
/* detail blocks */
.block{background:var(--surface-2);border-radius:var(--r-s);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.block .t{font-weight:900} .block .d{color:var(--fg-2);font-size:.95rem}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--surface-2);font-weight:800;color:var(--fg-2);font-size:.95rem}
.person .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.9rem}
.av.claude{background:var(--claude-soft);color:var(--claude)} .av.work{background:var(--work-soft);color:var(--work)} .av.deniz{background:var(--deniz-soft);color:var(--deniz)} .av.ci{background:var(--surface-2);color:var(--fg-2)}
.person.active{background:var(--brand-soft);color:var(--brand-ink);outline:2px solid var(--brand)}
.arrow{color:var(--fg-3);font-weight:900}
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step{display:flex;flex-direction:column;gap:6px;min-width:0}
.bar{height:10px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden} .bar i{position:absolute;inset:0;border-radius:999px;background:var(--line)}
.step.pass .bar i{background:var(--good)} .step.partial .bar i{background:linear-gradient(90deg,var(--good) 0 60%,var(--warn) 60% 100%)} .step.active .bar i{background:var(--brand)} .step.blocked .bar i{background:var(--bad)}
.step .lbl{font-size:.84rem;font-weight:800;color:var(--fg-2);line-height:1.25} .step .st{font-size:.8rem;font-weight:800}
.step.pass .st{color:var(--good)} .step.partial .st{color:var(--warn)} .step.active .st{color:var(--brand)} .step.blocked .st{color:var(--bad)} .step.pending .st{color:var(--fg-3)}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res{border-radius:var(--r-s);padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2);min-width:0}
.res .k{font-size:.82rem;font-weight:800;color:var(--fg-2)} .res .v{font-size:1.5rem;font-weight:900;line-height:1.1} .res .e{font-size:.84rem;color:var(--fg-2)}
.res.good{background:var(--good-soft)} .res.good .v{color:var(--good)} .res.warn{background:var(--warn-soft)} .res.warn .v{color:var(--warn)} .res.bad{background:var(--bad-soft)} .res.bad .v{color:var(--bad)}
.row{display:flex;gap:12px;align-items:flex-start}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2)} .row .ic svg{width:20px;height:20px}
.row .tt{font-weight:800} .row .dd{color:var(--fg-2);font-size:.92rem}
.feed{display:flex;flex-direction:column;gap:12px}
.msg{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px}
.msg .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.9rem;align-self:start}
.bubble{background:var(--surface-2);border-radius:14px;border-top-left-radius:4px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.msg.claude .bubble{background:var(--claude-soft)} .msg.work .bubble{background:var(--work-soft)} .msg.deniz .bubble{background:var(--deniz-soft)}
.bubble .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap} .bubble .h b{font-weight:900} .bubble .h .k{font-size:.8rem;font-weight:800;color:var(--fg-2)} .bubble .h time{font-size:.78rem;color:var(--fg-3);margin-left:auto}
.bubble .m{font-size:.93rem;overflow-wrap:anywhere}
.empty{padding:22px 14px;text-align:center;color:var(--fg-3);border:2px dashed var(--line);border-radius:var(--r-s)}
.detail{font-size:.86rem;color:var(--fg-3)} .detail a,a{color:var(--brand-deep);font-weight:800}
dl.terms{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;font-size:.95rem;margin:0}
dl.terms dt{font-weight:900;color:var(--brand-deep);white-space:nowrap} dl.terms dd{margin:0;color:var(--fg-2)}
/* charts */
.hero{flex-direction:row;align-items:center;gap:16px}
.hero .txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ring{width:92px;height:92px;flex:none}
.ring text{font-family:var(--sans);font-weight:900;fill:#fff}
.strip{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.strip .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.strip .hd b{font-weight:900} .strip .hd span{font-size:.84rem;color:var(--fg-3)}
.tl{width:100%;height:auto;display:block}
.tl .tick{stroke:var(--line);stroke-width:1.5} .tl .lab{font-family:var(--sans);font-size:20px;fill:var(--fg-2);font-weight:800}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--fg-2);font-weight:700}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.legend i.claude{background:#d99a1e} .legend i.work{background:var(--work)} .legend i.wait{background:repeating-linear-gradient(135deg,var(--line) 0 3px,var(--surface-2) 3px 6px)}
.hist{overflow-x:auto} .hist table{border-collapse:separate;border-spacing:6px 6px;font-size:.84rem;min-width:100%}
.hist th{font-weight:800;color:var(--fg-2);text-align:left;white-space:nowrap;padding:0 4px} .hist thead th{font-size:.72rem;color:var(--fg-3);text-align:center;vertical-align:bottom;line-height:1.15}
.hist td{text-align:center;padding:0} .cell{display:inline-grid;place-items:center;width:34px;height:30px;border-radius:9px;font-weight:900;font-size:.9rem;background:var(--surface-2);color:var(--fg-3)}
.cell.good{background:var(--good-soft);color:var(--good)} .cell.warn{background:var(--warn-soft);color:var(--warn)} .cell.bad{background:var(--bad-soft);color:var(--bad)}
@media (max-width:420px){.ring{width:78px;height:78px}}
@media (prefers-reduced-motion:no-preference){.chip.good.dot::before{animation:beat 2.6s ease-in-out infinite}@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}}
</style>

<div class="wrap">
  <div class="band">
    <img src="logo.webp" alt="Oryvona Games" width="240" height="135">
    <div class="meta"><span class="sub">Stüdyo paneli · ekip içi</span><span class="chip dot onnavy" id="fresh">Bağlanıyor…</span></div>
  </div>

  <div class="tabs" id="tabs" role="tablist" aria-label="Projeler"><span class="muted small">Projeler yükleniyor…</span></div>

  <div class="hero" id="hero">
    <div class="txt">
      <span class="k">Şu an</span>
      <span class="v" id="heroV">Veri bekleniyor</span>
      <span class="s" id="heroS">Projenin durumu ilk güncellemeyle burada görünür.</span>
    </div>
    <svg class="ring" id="ring" viewBox="0 0 100 100" role="img" aria-label="Aşama ilerlemesi"></svg>
  </div>
  <div class="strip" id="strip" hidden>
    <div class="hd"><b>Son 24 saat · kim çalıştı</b><span id="stripSub"></span></div>
    <svg class="tl" id="tl" viewBox="0 0 600 58" role="img" aria-label="Son 24 saatte sıra kimdeydi"></svg>
    <div class="legend"><span><i class="claude"></i>Claude</span><span><i class="work"></i>OpenAI</span><span><i class="wait"></i>Bekleme</span></div>
  </div>

  <div class="cards">
    <button class="cardbtn" type="button" data-sheet="turn"><span class="ic" id="icTurn"></span><span class="tx"><span class="k">Sıra kimde</span><span class="v" id="cTurn">—</span><span class="s" id="cTurnS"></span></span><span class="chev"></span></button>
    <button class="cardbtn" type="button" data-sheet="stage"><span class="ic" id="icStage"></span><span class="tx"><span class="k">Oyun nerede</span><span class="v" id="cStage">—</span><span class="s" id="cStageS"></span></span><span class="chev"></span></button>
    <button class="cardbtn" type="button" data-sheet="qa"><span class="ic" id="icQa"></span><span class="tx"><span class="k">Son test</span><span class="v" id="cQa">—</span><span class="s" id="cQaS"></span></span><span class="chev"></span></button>
    <button class="cardbtn" type="button" data-sheet="auto"><span class="ic" id="icAuto"></span><span class="tx"><span class="k">Otomasyon</span><span class="v" id="cAuto">—</span><span class="s" id="cAutoS"></span></span><span class="chev"></span></button>
    <button class="cardbtn" type="button" data-sheet="worknote" id="cardWork" hidden><span class="ic work" id="icWork"></span><span class="tx"><span class="k">OpenAI'dan son not</span><span class="v" id="cWork">—</span><span class="s" id="cWorkS"></span></span><span class="chev"></span></button>
    <button class="cardbtn" type="button" data-sheet="feed"><span class="ic" id="icFeed"></span><span class="tx"><span class="k">Ekip akışı</span><span class="v" id="cFeed">—</span><span class="s" id="cFeedS"></span></span><span class="chev"></span></button>
    <button class="cardbtn" type="button" data-sheet="terms"><span class="ic" id="icTerms"></span><span class="tx"><span class="k">Yardım</span><span class="v">Terimler ve roller</span><span class="s">Claude, OpenAI, sıra, engel ne demek?</span></span><span class="chev"></span></button>
  </div>
  <p class="foot" id="footNote">Oryvona Games · ekip içi</p>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <header><h2 id="sheetTitle">Ayrıntı</h2><button class="close" type="button" id="sheetClose" aria-label="Kapat">×</button></header>
  <div class="body" id="sheetBody"></div>
</section>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const I={clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
    cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 18a4 4 0 0 1-.6-7.95A6 6 0 0 1 18 9a4.5 4.5 0 0 1-1 8.9z"/></svg>',
    flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-1.5 3.5L16 11H5"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>',
    user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'};
  document.querySelectorAll(".chev").forEach(e=>e.innerHTML=I.chev);
  $("icTerms").innerHTML=I.help;$("icFeed").innerHTML=I.chat;$("icWork").innerHTML=I.bolt;$("icStage").innerHTML=I.flag;$("icQa").innerHTML=I.check;$("icAuto").innerHTML=I.clock;$("icTurn").innerHTML=I.user;

    <div style="font-weight:900;font-size:1.15rem">Ekip girişi</div>
    <p id="gateText" style="margin:0;color:#cfcbe6;font-size:.95rem">E-postanı yaz; sana tek kullanımlık bir giriş bağlantısı gönderelim. Şifre yok.</p>
    <input id="gateEmail" type="email" required autocomplete="email" placeholder="ad@ornek.com" style="font:inherit;font-size:1rem;padding:12px 14px;border-radius:12px;border:1.5px solid #3a3870;background:#12112e;color:#fff">
    <button id="gateBtn" type="submit" style="font:inherit;font-weight:900;font-size:1rem;padding:12px;border-radius:12px;border:0;background:#f0b429;color:#12112e;cursor:pointer">Giriş bağlantısı gönder</button>
    <div id="gateCodeWrap" hidden data-enabled="false" style="display:flex;flex-direction:column;gap:8px">
      <label for="gateCode" style="font-size:.9rem;color:#cfcbe6">E-postadaki 6 haneli kodu yaz:</label>
      <input id="gateCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" style="font:inherit;font-size:1.4rem;letter-spacing:.3em;text-align:center;padding:12px 14px;border-radius:12px;border:1.5px solid #3a3870;background:#12112e;color:#fff">
      <button id="gateVerify" type="button" style="font:inherit;font-weight:900;font-size:1rem;padding:12px;border-radius:12px;border:0;background:#22c3ee;color:#12112e;cursor:pointer">Kodla giriş yap</button>
    </div>
    <div id="gateMsg" style="min-height:1.2em;font-size:.9rem;color:#8fe3ad"></div>
  </form>`;
  document.body.appendChild(gate);
  const logoEl=document.querySelector(".band img");if(logoEl)gate.querySelector("#gateLogo").src=logoEl.getAttribute("src");
  const gateMsg=(t,bad)=>{const m=gate.querySelector("#gateMsg");m.textContent=t;m.style.color=bad?"#ff9c9c":"#8fe3ad";};
  gate.querySelector("#gateForm").addEventListener("submit",async e=>{e.preventDefault();const email=gate.querySelector("#gateEmail").value.trim();if(!email){gateMsg("Önce e-posta yaz.",true);return;}
    gate.querySelector("#gateBtn").disabled=true;gateMsg("Gönderiliyor…");
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
    gate.querySelector("#gateBtn").disabled=false;
    if(error){gateMsg("Gönderilemedi: "+error.message,true);return;}
    const codeUi=gate.querySelector("#gateCodeWrap");if(codeUi.dataset.enabled==="true"){codeUi.hidden=false;gate.querySelector("#gateCode").focus();}
    gateMsg("Bağlantı gönderildi. E-postanı aç (gerekirse Gereksiz klasörü) ve bağlantıya dokun; uygulama kendiliğinden açılır.");});
  gate.querySelector("#gateVerify").addEventListener("click",async()=>{const email=gate.querySelector("#gateEmail").value.trim();const token=gate.querySelector("#gateCode").value.replace(/\D/g,"");
    if(token.length!==6){gateMsg("6 haneli kodu eksiksiz yaz.",true);return;}
    gateMsg("Kontrol ediliyor…");const {error}=await sb.auth.verifyOtp({email,token,type:"email"});
    if(error){gateMsg("Kod kabul edilmedi: "+error.message,true);return;}gateMsg("Giriş yapıldı.");});
  gate.querySelector("#gateCode").addEventListener("input",()=>{if(gate.querySelector("#gateCode").value.replace(/\D/g,"").length===6)gate.querySelector("#gateVerify").click();});
  // Sign-out control appended to the header band.
  const out=document.createElement("button");out.type="button";out.textContent="Çıkış";out.hidden=true;
  out.style.cssText="font:inherit;font-weight:800;font-size:.8rem;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#cfcbe6;cursor:pointer";
  document.querySelector(".band .meta")?.appendChild(out);
  out.addEventListener("click",async()=>{await sb.auth.signOut();});
  async function loadAll(id){
    const [st,ev,rn]=await Promise.all([
      sb.from("project_status").select("data,updated_at").eq("project_id",id).maybeSingle(),
      sb.from("events").select("*").eq("project_id",id).order("at",{ascending:false}).limit(60),
      sb.from("runs").select("run_id,data,started_at").eq("project_id",id).order("started_at",{ascending:true,nullsFirst:true}).limit(60)]);
    if(st.error||ev.error||rn.error){console.error(st.error||ev.error||rn.error);$("fresh").className="chip dot onnavy bad";$("fresh").textContent="Bağlantı hatası";return;}
    feedDocs=(ev.data||[]).map(r=>asDoc({...r,kindTr:r.kind_tr,textTr:r.text_tr,titleTr:r.title_tr}));
    runsDocs=(rn.data||[]).map(r=>asDoc({...r.data,run_id:r.run_id,startedAt:r.started_at||r.data?.startedAt||null}));
    renderFeedCard();renderTimeline("tl",24);applyStatus(st.data);
  }
  function select(id){
    if(id===current)return;current=id;remember(id);status=null;feedDocs=[];runsDocs=[];freshness();
    document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.id===id)));
    if(channel){sb.removeChannel(channel);channel=null;}
    loadAll(id);
    channel=sb.channel("panel-"+id)
      .on("postgres_changes",{event:"*",schema:"public",table:"project_status",filter:"project_id=eq."+id},()=>loadAll(id))
      .on("postgres_changes",{event:"*",schema:"public",table:"events",filter:"project_id=eq."+id},()=>loadAll(id))
      .on("postgres_changes",{event:"*",schema:"public",table:"runs",filter:"project_id=eq."+id},()=>loadAll(id))
      .subscribe(state=>{if(state==="CHANNEL_ERROR"||state==="TIMED_OUT")console.warn("realtime",state);});
  }
  function renderTabs(list){const t=$("tabs");t.innerHTML="";
    if(!list.length){t.innerHTML='<span class="muted small">Bu hesap ekip listesinde değil. Deniz\'den e-postanı ekletmesini iste.</span>';$("fresh").className="chip dot onnavy warn";$("fresh").textContent="Yetki yok";return;}
    for(const p of list){const b=document.createElement("button");b.className="tab";b.type="button";b.setAttribute("role","tab");b.dataset.id=p.id;b.innerHTML=`${esc(p.name||p.id)}${p.code?` <span class="code">${esc(p.code)}</span>`:""}`;b.addEventListener("click",()=>select(p.id));t.appendChild(b);}
    const want=recall();select(list.some(p=>p.id===want)?want:list[0].id);}
  // Team management (owners only): a card + sheet to add/remove team emails.
  let team=[],isOwner=false;
  const teamCard=document.createElement("button");teamCard.className="cardbtn";teamCard.type="button";teamCard.hidden=true;teamCard.dataset.sheet="team";
  teamCard.innerHTML=`<span class="ic deniz">${I.user}</span><span class="tx"><span class="k">Ekip</span><span class="v" id="cTeam">—</span><span class="s">Kim giriş yapabilir? Ekle / çıkar</span></span><span class="chev">${I.chev}</span>`;
  const cardsBox=document.querySelector(".cards");if(cardsBox)cardsBox.insertBefore(teamCard,cardsBox.lastElementChild);
  teamCard.addEventListener("click",()=>show("team"));
  async function loadTeam(){const {data,error}=await sb.from("team_members").select("email,name,role,added_at").order("added_at");if(error){console.warn(error);return;}
    team=data||[];const me=(session?.user?.email||"").toLowerCase();isOwner=team.some(m=>m.email===me&&m.role==="owner");
    teamCard.hidden=!isOwner;$("cTeam").textContent=`${team.length} kişi`;refreshSheet();}
  function sheetTeam(){if(!isOwner)return '<div class="empty">Bu bölüm yalnız stüdyo sahibine açık.</div>';
    const me=(session?.user?.email||"").toLowerCase();
    let out=`<p class="muted">Listedeki e-postalar panele girebilir. Herhangi bir e-posta sağlayıcısı olur.</p><form id="teamForm" style="display:flex;gap:8px;flex-wrap:wrap"><input id="teamEmail" type="email" required placeholder="yeni@ekip.com" style="flex:1;min-width:200px;font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line)"><input id="teamName" placeholder="Ad (isteğe bağlı)" style="flex:1;min-width:140px;font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line)"><button type="submit" style="font:inherit;font-weight:900;padding:10px 16px;border-radius:12px;border:0;background:var(--brand);color:#fff;cursor:pointer">Ekle</button></form><div id="teamMsg" class="detail"></div><div class="feed">`;
    for(const m of team){out+=`<div class="block" style="flex-direction:row;align-items:center;justify-content:space-between;gap:10px"><div><div class="t">${esc(m.name||m.email)}</div><div class="d">${esc(m.email)} · ${m.role==="owner"?"sahip":"üye"}</div></div>${m.email!==me?`<button type="button" data-remove="${esc(m.email)}" style="font:inherit;font-weight:800;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer">Çıkar</button>`:'<span class="chip brand">sen</span>'}</div>`;}
    return out+'</div>';}
  document.addEventListener("submit",async e=>{if(e.target.id!=="teamForm")return;e.preventDefault();const email=$("teamEmail").value.trim().toLowerCase(),name=$("teamName").value.trim();
    if(!email){$("teamMsg").textContent="E-posta yaz.";return;}const {error}=await sb.from("team_members").insert({email,name:name||null,role:"member"});
    $("teamMsg").textContent=error?"Eklenemedi: "+error.message:"Eklendi: "+email;if(!error)loadTeam();});
  document.addEventListener("click",async e=>{const b=e.target.closest("[data-remove]");if(!b)return;b.disabled=true;const {error}=await sb.from("team_members").delete().eq("email",b.dataset.remove);
    if(error){$("teamMsg").textContent="Çıkarılamadı: "+error.message;b.disabled=false;}else loadTeam();});
  SHEETS.team=["Ekip",sheetTeam];
  async function start(){
    const {data,error}=await sb.from("projects").select("id,name,code,sort_order").order("sort_order",{ascending:true});
    if(error){console.error(error);$("fresh").className="chip dot onnavy bad";$("fresh").textContent="Bağlantı hatası";return;}
    renderTabs(data||[]);loadTeam();
  }
  function stop(){if(channel){sb.removeChannel(channel);channel=null;}current=null;status=null;feedDocs=[];runsDocs=[];freshness();$("tabs").innerHTML="";}
  (async()=>{
    if(!CFG.url||!CFG.anonKey||!window.supabase){$("fresh").className="chip dot onnavy bad";$("fresh").textContent="Veri kaynağı ayarlı değil";$("tabs").innerHTML="";return;}
    // implicit flow: the magic link carries the session in the URL itself, so it works even when the link is opened in another browser/app than the one that requested it.
    sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{flowType:"implicit",detectSessionInUrl:true,persistSession:true,autoRefreshToken:true},realtime:{params:{eventsPerSecond:5}}});
    sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_IN"&&location.hash.includes("access_token"))history.replaceState(null,"",location.pathname);});
    const apply=s=>{session=s;const signedIn=!!s;gate.hidden=signedIn;out.hidden=!signedIn;if(signedIn){start();}else{stop();$("fresh").className="chip dot onnavy";$("fresh").textContent="Giriş gerekli";}};
    const {data:{session:s0}}=await sb.auth.getSession();apply(s0);
    sb.auth.onAuthStateChange((_e,s)=>{if(!!s!==!!session)apply(s);});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden&&current)loadAll(current);});
  })();
})();
</script>


</body>
</html>
